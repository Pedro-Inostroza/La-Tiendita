{% if ventas %}<table><tr><th>Fecha</th><th>Producto</th><th>Cantidad</th><th>Total</th><th>Vendedor</th></tr>{% for venta in ventas %}<tr><td>{{ venta.creada_en|date:'d/m/Y H:i' }}</td><td>{{ venta.producto.nombre }}</td><td>{{ venta.cantidad }}</td><td>${{ venta.total }}</td><td>{{ venta.vendedor.username }}</td></tr>{% endfor %}</table>{% else %}<p>No hay ventas para mostrar.</p>{% endif %}
