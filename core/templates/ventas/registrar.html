{% extends 'base.html' %}
{% block title %}Nueva venta | La Tiendita{% endblock %}
{% block content %}<section class="card"><h1>Registrar venta</h1><form method="post">{% csrf_token %}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}<div class="errores">{{ field.errors }}</div>{% endfor %}<button type="submit">Registrar</button><a class="boton" href="{% url 'ventas:lista' %}">Cancelar</a></form></section>{% endblock %}
