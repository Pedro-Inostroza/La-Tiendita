{% extends 'base.html' %}
{% block content %}<section class="card"><h1>{% if object %}Editar{% else %}Nuevo{% endif %} producto</h1><form method="post">{% csrf_token %}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}<div class="errores">{{ field.errors }}</div>{% endfor %}<button type="submit">Guardar</button><a class="boton" href="{% url 'inventario:lista' %}">Cancelar</a></form></section>{% endblock %}
